networks:
  wings-network:
    driver: bridge
services:
  # ── Neo4j Graph Database ──────────────────────────────────────────────
  neo4j:
    image: neo4j:5.26.0
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: ${NEO4J_USER}/${NEO4J_PASSWORD}
      NEO4J_internal_dbms_tx__log_fail__on__corrupted__log__files: "false"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./neo4j/data-vector:/data-vector
      - ./neo4j/import:/import
      - ./neo4j/plugins:/plugins
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    networks:
      - wings-network

  # ── FastAPI Backend ────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e2b}
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
      MODEL_TYPE: ${MODEL_TYPE:-LOCAL}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # Persist SQLite DB inside the backend_data named volume so it survives
      # container rebuilds and does not depend on a host file existing.
      DATABASE_URL: sqlite:////app/data/assessment.db
    volumes:
      - backend_data:/app/data
      - backend_uploads:/app/uploads
      # Source markdowns + generated parsed articles are read by cra_agents tools
      - ./outputs:/app/outputs
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-model-pull:
        condition: service_completed_successfully
      ollama-model-pull-embedding:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - wings-network

  # ── React Frontend (nginx) ────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "80:80"
    volumes:
      # Runtime maintenance flag — edit ./maintenance.json on the host to toggle.
      # Mounted read-only so the container cannot modify it.
      - ./maintenance.json:/usr/share/nginx/html/maintenance.json:ro
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - wings-network

  # ── Ollama (local LLM server) ───────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10
    networks:
      - wings-network

  # ── Pull model for agent once on boot ─────────────────────────────────────────
  ollama-model-pull:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e2b}
    entrypoint: ["/bin/sh", "-c", 'ollama pull "$$OLLAMA_MODEL"']
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    networks:
      - wings-network

  # ── Pull model for embedding once on boot ─────────────────────────────────────────
  ollama-model-pull-embedding:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_EMBEDDING_MODEL: ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text}
    entrypoint: ["/bin/sh", "-c", 'ollama pull "$$OLLAMA_EMBEDDING_MODEL"']
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    networks:
      - wings-network
  # ── ADK Agent Web UI ──────────────────────────────────────────────────
  adk:
    build:
      context: .
      dockerfile: cra_agents/Dockerfile
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-gemma4:e2b}
    volumes:
      - ./outputs/:/app/outputs/
    depends_on:
      neo4j:
        condition: service_healthy
      ollama:
        condition: service_healthy
      ollama-model-pull:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - wings-network

volumes:
  neo4j_data:
  neo4j_logs:
  backend_data:
  backend_uploads:
  ollama_data:
